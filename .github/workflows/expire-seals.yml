name: expire sealed links

on:
  schedule:
    - cron: '0 12 8 10 *'   # Oct 8, 12:00 UTC = 8:00 AM EDT
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/expire-seals.mjs
      - name: commit, push, rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am '[auto] strip expired sealed links'
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
